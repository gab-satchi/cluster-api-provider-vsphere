apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
spec:
  template:
    spec:
      containers:
        - name: manager
          env:
          - name: NODE_NETWORK_CM_NAME
            value: capv-node-network-config
          - name: NODE_NETWORK_CM_NAMESPACE
            value: capv-system
