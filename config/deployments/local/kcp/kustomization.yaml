namespace: vmware-system-capv

#images:
#- name: gcr.io/k8s-staging-cluster-api/kubeadm-control-plane-controller
#  newTag: v0.3.17

resources:
- ./manifest.yaml

patches:
- path: ./manager_anti_affinity_patch.yaml
- path: ./update_strategy_patch.yaml
  target:
    group: apps
    version: v1
    kind: Deployment
    name: capi-kubeadm-control-plane-controller-manager
    namespace: capi-kubeadm-control-plane-system
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/args/1
      value: --metrics-bind-addr=127.0.0.1:8080
    - op: remove
      path: /spec/template/spec/containers/0/args/2
  target:
    group: apps
    version: v1
    kind: Deployment
    name: capi-kubeadm-control-plane-controller-manager
    namespace: capi-kubeadm-control-plane-system

  # NOTE: Patch all cert-manager injections since we can't supply variables
  # when running Kustomize against the upstream for download
- path: ./cert_injection_patch.yaml
  target:
    group: apiextensions.k8s.io
    version: v1
    kind: CustomResourceDefinition
- patch: |-
    - op: replace
      path: /metadata/annotations/cert-manager.io~1inject-ca-from
      value: vmware-system-capv/capi-kubeadm-control-plane-serving-cert
  target:
    group: admissionregistration.k8s.io
    version: v1
- patch: |-
    - op: replace
      path: /spec/dnsNames
      value:
        - capi-kubeadm-control-plane-webhook-service.vmware-system-capv.svc
        - capi-kubeadm-control-plane-webhook-service.vmware-system-capv.svc.cluster.local
  target:
    group: cert-manager.io
    version: v1
    kind: Certificate
    name: capi-kubeadm-control-plane-serving-cert
    namespace: capi-kubeadm-control-plane-system

  # NOTE: Patch all CRDs to override any existing defaulted-values for
  # `spec.preserveUnkownFields`. Older versions defaulted to "true" when not
  # defined, which will impede our ability to set webhook conversions.
  #
  # This should be explicitly declared in the upstream and thus this patch
  # removed once it has been.
- patch: |-
    - op: add
      path: /spec/preserveUnknownFields
      value: false
  target:
    group: apiextensions.k8s.io
    version: v1
    kind: CustomResourceDefinition
