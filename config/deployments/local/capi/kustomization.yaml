  # NOTE: Patch all cert-manager injections since we can't supply variables
  # when running Kustomize against the upstream for download
- path: ./cert_injection_patch.yaml
  target:
    group: apiextensions.k8s.io
    version: v1
    kind: CustomResourceDefinition
    name: clusters.cluster.x-k8s.io
- path: ./cert_injection_patch.yaml
  target:
    group: apiextensions.k8s.io
    version: v1
    kind: CustomResourceDefinition
    name: machinedeployments.cluster.x-k8s.io
- path: ./cert_injection_patch.yaml
  target:
    group: apiextensions.k8s.io
    version: v1
    kind: CustomResourceDefinition
    name: machinehealthchecks.cluster.x-k8s.io
- path: ./cert_injection_patch.yaml
  target:
    group: apiextensions.k8s.io
    version: v1
    kind: CustomResourceDefinition
    name: machines.cluster.x-k8s.io
- path: ./cert_injection_patch.yaml
  target:
    group: apiextensions.k8s.io
    version: v1
    kind: CustomResourceDefinition
    name: machinesets.cluster.x-k8s.io
- path: ./cert_injection_patch.yaml
  target:
    group: apiextensions.k8s.io
    version: v1
    kind: CustomResourceDefinition
    name: machinepools.cluster.x-k8s.io
#- path: ./cert_injection_patch.yaml
#  target:
#    group: admissionregistration.k8s.io
#    version: v1
#    kind: MutatingWebhookConfiguration
- patch: |-
    - op: replace
      path: /metadata/annotations/cert-manager.io~1inject-ca-from
      value: vmware-system-capv/capi-serving-cert
  target:
    group: admissionregistration.k8s.io
    version: v1
- patch: |-
    - op: replace
      path: /spec/dnsNames
      value:
        - capi-webhook-service.vmware-system-capv.svc
        - capi-webhook-service.vmware-system-capv.svc.cluster.local
  target:
    group: cert-manager.io
    version: v1
    kind: Certificate
    name: capi-serving-cert
    namespace: capi-system

  # NOTE: Patch all CRDs to override any existing defaulted-values for
  # `spec.preserveUnkownFields`. Older versions defaulted to "true" when not
  # defined, which will impede our ability to set webhook conversions.
  #
  # This should be explicitly declared in the upstream and thus this patch
  # removed once it has been.
- patch: |-
    - op: add
      path: /spec/preserveUnknownFields
      value: false
  target:
    group: apiextensions.k8s.io
    version: v1
    kind: CustomResourceDefinition
